<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e8b84b" />
  <title>Producto — Deo Gratias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/product.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand-mark">
        <span class="brand-name">Deo Gratias</span>
        <span class="brand-tagline">Joyeria Fina</span>
      </a>
      <nav class="header-actions">
        <a href="/" class="btn btn-ghost magnetic-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Volver al Catalogo</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- ── Product Detail ─────────────────────────────────────────────── -->
  <main class="product-detail" id="product-detail">
    <div class="product-detail-loading">
      <div class="loader"></div>
      <p>Cargando producto...</p>
    </div>
  </main>

  <!-- ── Footer ─────────────────────────────────────────────────────── -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">Deo Gratias</div>
      <div class="footer-divider-row">
        <div class="footer-gold-line"></div>
        <div class="footer-diamond">&#9670;</div>
        <div class="footer-gold-line"></div>
      </div>
      <p class="footer-copy">&copy; 2026 Deo Gratias. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script>
    const WHATSAPP_PHONE = '50688830657';

    function whatsappUrl(productName) {
      const msg = encodeURIComponent(`Hola, me interesa esta pieza: ${productName}`);
      return `https://wa.me/${WHATSAPP_PHONE}?text=${msg}`;
    }

    async function loadProduct() {
      const container = document.getElementById('product-detail');
      const filename = decodeURIComponent(window.location.pathname.split('/').pop());

      try {
        const res = await fetch(`/api/images?limit=200`);
        const data = await res.json();
        const product = data.images.find(img => img.filename === filename);

        if (!product) {
          container.innerHTML = `
            <div class="product-not-found">
              <h2>Producto no encontrado</h2>
              <p>El producto que busca no existe.</p>
              <a href="/" class="btn btn-gold">Volver al Catalogo</a>
            </div>`;
          return;
        }

        document.title = `${product.name} — Deo Gratias`;

        container.innerHTML = `
          <div class="product-detail-grid">
            <div class="product-detail-image">
              <img src="${product.url}" alt="${product.name}" />
            </div>
            <div class="product-detail-info">
              <div class="product-detail-breadcrumb">
                <a href="/">Catalogo</a>
                ${product.collection ? `<span>/</span><a href="/?collection=${encodeURIComponent(product.collection)}">${product.collection}</a>` : ''}
                ${product.category ? `<span>/</span><a href="/?category=${encodeURIComponent(product.category)}">${product.category}</a>` : ''}
              </div>

              <h1 class="product-detail-name">${product.name}</h1>

              ${product.price ? `<div class="product-detail-price">${product.price}</div>` : ''}

              <div class="product-detail-divider"></div>

              <div class="product-detail-meta">
                ${product.collection ? `
                  <div class="meta-row">
                    <span class="meta-label">Coleccion</span>
                    <span class="meta-value">${product.collection}</span>
                  </div>` : ''}
                ${product.category ? `
                  <div class="meta-row">
                    <span class="meta-label">Categoria</span>
                    <span class="meta-value">${product.category}</span>
                  </div>` : ''}
                ${product.material ? `
                  <div class="meta-row">
                    <span class="meta-label">Material</span>
                    <span class="meta-value">${product.material}</span>
                  </div>` : ''}
                ${product.gemstone ? `
                  <div class="meta-row">
                    <span class="meta-label">Gema</span>
                    <span class="meta-value">${product.gemstone}</span>
                  </div>` : ''}
              </div>

              ${product.description ? `
                <div class="product-detail-divider"></div>
                <div class="product-detail-description">
                  <p>${product.description}</p>
                </div>` : ''}

              <div class="product-detail-actions">
                <a href="${whatsappUrl(product.name)}" target="_blank" rel="noopener" class="btn-whatsapp">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 1.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                  <span>Consultar por WhatsApp</span>
                </a>
              </div>
            </div>
          </div>`;
      } catch (err) {
        container.innerHTML = `
          <div class="product-not-found">
            <h2>Error al cargar</h2>
            <p>Intente nuevamente.</p>
            <a href="/" class="btn btn-gold">Volver al Catalogo</a>
          </div>`;
      }
    }

    loadProduct();
  </script>
</body>
</html>
